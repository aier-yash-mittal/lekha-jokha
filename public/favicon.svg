    <rect x="50" y="50" width="100" height="100" rx="18" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />
    <path d="M72 65 V130 C72 138.284 78.716 145 87 145 H130" stroke="url(#ribbonLeft)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M135 65 L98 120 C95 125 88 125 85 120 L75 105" stroke="url(#ribbonRight)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="135" cy="65" r="9" fill="#ffffff" />
    <circle cx="87" cy="85" r="6" fill="#ffffff" opacity="0.8" />
    <circle cx="130" cy="145" r="9" fill="#ffffff" />
